<!doctype html>
<html lang="fr" class="site-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Mailha</title>

    <style>
      /*
       * BOOTSTRAP — NO CONTENT FLASH
       *
       * Le navigateur garde #root invisible pendant le bootstrap réseau
       * de la configuration publiée. Aucun ancien contenu n'est affiché.
       */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #121613;
      }

      html.site-booting #root {
        visibility: hidden;
      }

      html.site-ready #root {
        visibility: visible;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
