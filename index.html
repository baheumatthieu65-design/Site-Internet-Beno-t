<!doctype html>
<html lang="fr" class="site-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Mailha</title>

    <style>
      /*
       * V63+ — BOOTSTRAP WITHOUT CONTENT FLASH
       *
       * Le navigateur garde #root invisible pendant le bootstrap de la
       * configuration publiée. Aucun ancien contenu ne doit être affiché
       * avant que App ait reçu son snapshot serveur ou le fallback généré.
       */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #121613;
      }

      html.site-booting #root {
        visibility: hidden;
      }

      html.site-ready #root {
        visibility: visible;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
